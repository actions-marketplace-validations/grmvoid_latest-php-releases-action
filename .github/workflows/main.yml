name: PHP Latest Releases

on:
    pull_request:
    push:

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run build
            - name: Verify committed bundle
              run: git diff --exit-code -- dist

    latest-releases:
        needs: quality
        runs-on: ubuntu-latest
        outputs:
            releases: ${{ steps.get-latest-releases.outputs.releases }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - uses: ./
              id: get-latest-releases

    print-php-version:
        needs: ['latest-releases']
        runs-on: ubuntu-latest
        strategy:
            matrix:
                releases: ${{ fromJson(needs.latest-releases.outputs.releases) }}
        steps:
            - run: echo "php-${{ matrix.releases.version }}"
